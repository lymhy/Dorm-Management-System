version: '3.8'
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: dorm
    ports:
      - "3306:3306"
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile-backend
    depends_on:
      - mysql
    ports:
      - "8080:8080"
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile-frontend
    ports:
      - "5173:5173"
